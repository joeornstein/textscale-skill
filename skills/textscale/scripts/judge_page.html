<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pairwise Judging</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
    --line: #dddbd5; --well: #eeece7; --accent: #2f5d8a; --accent-ink: #ffffff;
    --focus: #c98a1b; --cal: #6a5a2e; --cal-bg: #f3ecd9; --aud: #2f5d8a; --aud-bg: #e3ebf3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9b9a95;
      --line: #34332f; --well: #2a2a27; --accent: #6c9bd0; --accent-ink: #0e1620;
      --focus: #e0a84a; --cal: #e2cf98; --cal-bg: #35301f; --aud: #a9c6e6; --aud-bg: #1f2b38;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 28px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; }
  .badge.calibration { color: var(--cal); background: var(--cal-bg); }
  .badge.audit { color: var(--aud); background: var(--aud-bg); }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .bar { height: 4px; background: var(--well); border-radius: 2px; margin: 10px 0 16px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .prompt { font-size: 21px; line-height: 1.35; font-weight: 600; margin: 0 0 6px; max-width: 70ch; white-space: pre-wrap; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; max-width: 80ch; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0;
    transition: border-color .12s, box-shadow .12s; }
  .side:hover { border-color: var(--accent); }
  .side.picked { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus); }
  .label { font-weight: 700; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
  .well { background: var(--well); border-radius: 6px; height: min(58vh, 620px);
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .well img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .well.text { display: block; overflow-y: auto; padding: 14px 16px; cursor: text;
    height: auto; min-height: 140px; max-height: min(58vh, 620px); flex: 1; }
  body.text .side { cursor: default; }
  body.text .side:hover { border-color: var(--line); }
  .well.text p { margin: 0; white-space: pre-wrap; font: 16px/1.6 Georgia, "Iowan Old Style", serif;
    max-width: 68ch; overflow-wrap: anywhere; }
  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 9px 16px; cursor: pointer; min-width: 96px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; min-width: 120px; }
  button.chosen { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: default; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 5px; margin-left: 6px; opacity: .8; }
  .note { max-width: 760px; margin: 14px auto 0; }
  .note label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .note textarea { width: 100%; min-height: 54px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .note textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .done { text-align: center; padding: 80px 16px; }
  .done h2 { font-size: 26px; margin: 0 0 8px; }
  .err { color: #c0392b; text-align: center; margin-top: 10px; min-height: 1.4em; }
  @media (max-width: 760px) {
    .pair { grid-template-columns: 1fr; }
    .well { height: 36vh; }
    .prompt { font-size: 18px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <span class="badge" id="badge"></span>
    <span class="count" id="count">–</span>
  </header>
  <div class="bar"><div id="bar"></div></div>

  <section id="judge" hidden>
    <p class="prompt" id="prompt"></p>
    <p class="sub" id="sub"></p>
    <div class="pair">
      <div class="side" id="sideA" data-w="A"><span class="label">A</span><div class="well" id="wellA"></div></div>
      <div class="side" id="sideB" data-w="B"><span class="label">B</span><div class="well" id="wellB"></div></div>
    </div>
    <div class="controls">
      <button id="back">Back<kbd>⌫</kbd></button>
      <button class="primary" data-w="A">A<kbd>←</kbd></button>
      <button id="tieBtn" data-w="tie">Tie<kbd>↓</kbd></button>
      <button class="primary" data-w="B">B<kbd>→</kbd></button>
      <button data-w="skip" title="Can't be compared on this dimension">Skip<kbd>S</kbd></button>
    </div>
    <div class="note">
      <label for="note" id="noteLabel">Note (optional)</label>
      <textarea id="note" placeholder="What made this hard, or what you were weighing"></textarea>
    </div>
    <div class="hint">Arrow keys answer when you're not typing in the note. Every answer is saved as you go; you can close this tab and come back.</div>
    <div class="err" id="err"></div>
  </section>

  <section class="done" id="done" hidden>
    <h2>All pairs answered</h2>
    <p>Your answers are saved. Go back to Claude and say you're done.</p>
    <button id="review">Review my answers</button>
  </section>
</main>

<script>
const S = { ids: [], judged: {}, i: 0, allowTies: true, type: 'image', busy: false, cache: {} };
const $ = id => document.getElementById(id);

async function init() {
  const st = await (await fetch('/api/state')).json();
  Object.assign(S, { ids: st.pair_ids, judged: st.judged, allowTies: st.allow_ties, type: st.type });
  $('prompt').textContent = st.prompt;
  document.body.classList.toggle('text', st.type === 'text');
  const cal = st.kind === 'calibration';
  $('badge').textContent = cal ? `Calibration round · ${st.round}` : `Audit round · ${st.round} · judge blind`;
  $('badge').className = 'badge ' + (cal ? 'calibration' : 'audit');
  $('sub').textContent = cal
    ? "Answer by your own sense of the concept. Notes on hard or odd pairs are the most useful part of this round: they're how the question gets sharpened."
    : 'The question is now fixed. Answer each pair on its own terms; notes are optional.';
  $('noteLabel').textContent = cal ? 'Note (encouraged on hard pairs)' : 'Note (optional)';
  if (!S.allowTies) $('tieBtn').hidden = true;
  const first = S.ids.findIndex(id => !(id in S.judged));
  S.i = first === -1 ? S.ids.length : first;
  render();
}

async function getPair(id) {
  if (!S.cache[id]) S.cache[id] = fetch(`/api/pair/${id}`).then(r => r.json());
  return S.cache[id];
}

function fill(well, content) {
  well.replaceChildren();
  if (S.type === 'image') {
    well.className = 'well';
    const img = document.createElement('img'); img.src = content; img.alt = '';
    well.appendChild(img);
  } else {
    well.className = 'well text';
    const p = document.createElement('p'); p.textContent = content;
    well.appendChild(p); well.scrollTop = 0;
  }
}

async function render() {
  const n = Object.keys(S.judged).length, total = S.ids.length;
  $('count').textContent = `${n} / ${total} answered`;
  $('bar').style.width = (100 * n / total) + '%';
  const finished = S.i >= total;
  $('judge').hidden = finished; $('done').hidden = !finished;
  if (finished) return;
  const id = S.ids[S.i], prev = S.judged[id];
  const pair = await getPair(id);
  if (S.ids[S.i] !== id) return;  // navigated away while loading
  fill($('wellA'), pair.a); fill($('wellB'), pair.b);
  $('sideA').classList.toggle('picked', prev?.winner === 'A');
  $('sideB').classList.toggle('picked', prev?.winner === 'B');
  document.querySelectorAll('.controls [data-w]').forEach(b => b.classList.toggle('chosen', prev?.winner === b.dataset.w));
  $('note').value = prev?.note || '';
  $('back').disabled = S.i === 0;
  if (S.i + 1 < total) getPair(S.ids[S.i + 1]).then(p => { if (S.type === 'image') { new Image().src = p.a; new Image().src = p.b; } });
}

async function judge(w) {
  if (S.busy || S.i >= S.ids.length || (w === 'tie' && !S.allowTies)) return;
  S.busy = true; $('err').textContent = '';
  const id = S.ids[S.i], note = $('note').value.trim();
  try {
    const r = await fetch('/api/judge', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pair_id: id, winner: w, note }) });
    if (!r.ok) throw new Error();
    S.judged[id] = { winner: w, note };
    // Next unanswered pair after this one; else any unanswered pair; else
    // step forward (reviewing a finished round walks through it in order).
    const after = S.ids.findIndex((x, k) => k > S.i && !(x in S.judged));
    const any = S.ids.findIndex(x => !(x in S.judged));
    S.i = after !== -1 ? after : any !== -1 ? any : S.i + 1;
    render();
  } catch (e) {
    $('err').textContent = 'Could not save that answer. Is the judging server still running?';
  } finally { S.busy = false; }
}

function back() { if (S.i > 0) { S.i--; render(); } }

document.querySelectorAll('[data-w]').forEach(el => el.addEventListener('click', e => {
  // Text panels are for reading and scrolling; choose with the buttons or keys.
  if (el.classList.contains('side') && S.type === 'text') return;
  judge(el.dataset.w);
}));
$('back').addEventListener('click', back);
$('review').addEventListener('click', () => { S.i = 0; render(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') judge('A');
  else if (k === 'arrowright' || k === 'b') judge('B');
  else if (k === 'arrowdown' || k === 't') judge('tie');
  else if (k === 's') judge('skip');
  else if (k === 'n') { e.preventDefault(); $('note').focus(); }
  else if (k === 'backspace') { e.preventDefault(); back(); }
});
init();
</script>
</body>
</html>
